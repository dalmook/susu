name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare riddle data
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          path = Path("data/riddles.json")
          wire = json.loads(path.read_text(encoding="utf-8"))

          if wire.get("encoding") == "gzip-base64":
              decoded = gzip.decompress(
                  base64.b64decode(wire["payload"])
              ).decode("utf-8")
              json.loads(decoded)
              path.write_text(decoded, encoding="utf-8")
              print("Decoded compressed riddle data for deployment.")
          else:
              print("Riddle data is already plain JSON.")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
