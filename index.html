<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>수수께끼 놀이터</title>
<style>
:root{--ink:#29223b;--muted:#70677e;--violet:#7c3aed;--pink:#ec4899;--line:#eadff6;--card:rgba(255,255,255,.94);--shadow:0 18px 50px rgba(72,45,101,.16)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 8% 5%,#ffe79a 0 7%,transparent 8%),radial-gradient(circle at 94% 13%,#dec7ff 0 10%,transparent 11%),linear-gradient(145deg,#fffaf0,#f5efff 62%,#effaff)}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(940px,100%);margin:auto;padding:16px 14px 80px}header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 16px}.brand{font-size:clamp(22px,5vw,31px);font-weight:950;display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 9px 23px #7c3aed44}.icons{display:flex;gap:8px}.icon,.btn{border:0;border-radius:16px;font-weight:850;min-height:46px}.icon{width:46px;background:var(--card);font-size:20px;box-shadow:0 7px 20px #3d25521a}.btn{padding:12px 17px}.primary{color:#fff;background:linear-gradient(135deg,var(--violet),#a855f7);box-shadow:0 9px 21px #7c3aed3d}.soft{background:#f5effb;color:var(--ink)}.yellow{background:#fff0b5;color:#664d00}.danger{background:#fee2e2;color:#991b1b}.panel{background:var(--card);border:1px solid #ffffffcc;border-radius:28px;padding:clamp(20px,5vw,34px);box-shadow:var(--shadow);backdrop-filter:blur(15px)}.hidden{display:none!important}.hero{text-align:center;overflow:hidden}.heroEmoji{font-size:clamp(58px,14vw,92px);animation:bob 2.7s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}h1{font-size:clamp(34px,8vw,55px);line-height:1.07;letter-spacing:-.055em;margin:7px 0 10px}.lead{font-size:clamp(16px,3.5vw,20px);line-height:1.55;color:var(--muted);max-width:650px;margin:0 auto 22px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mode{border:0;border-radius:23px;text-align:left;padding:20px;min-height:164px;transition:.18s}.mode:hover{transform:translateY(-4px);box-shadow:0 14px 30px #40245b24}.mode:first-child{background:linear-gradient(145deg,#fff0a5,#ffd58b)}.mode:last-child{background:linear-gradient(145deg,#e5d5ff,#cceaff)}.mode b{display:block;font-size:23px;margin:5px 0}.mode span{font-size:43px}.mode small{color:#5c5268;line-height:1.45}.filters{display:grid;grid-template-columns:1.2fr 1fr auto;gap:9px;margin-top:17px}select,input{width:100%;border:2px solid var(--line);border-radius:15px;padding:12px 13px;background:#fff;color:var(--ink)}.tiny{font-size:13px;color:var(--muted);line-height:1.5}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.progressBar{flex:1;height:11px;background:#ece4f4;border-radius:99px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#ec4899,var(--violet));transition:.25s}.stat{font-weight:900;white-space:nowrap}.questionCard{text-align:center;min-height:430px;display:flex;flex-direction:column;justify-content:center}.pill{align-self:center;padding:7px 12px;border-radius:99px;background:#f4effa;color:#60477d;font-size:14px;font-weight:850}.qEmoji{font-size:clamp(64px,16vw,98px);margin:12px 0 2px}.question{font-size:clamp(25px,5.7vw,40px);line-height:1.34;font-weight:950;letter-spacing:-.035em;max-width:760px;margin:10px auto 17px}.box{max-width:700px;margin:10px auto 0;border-radius:17px;padding:13px 15px;line-height:1.55}.hint{background:#fff6d2;color:#674e00}.answer{background:#e4fae8;color:#14532d;font-size:clamp(24px,5vw,38px);font-weight:950}.explain{background:#ebf4ff;color:#25486b}.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px}.choices{display:grid;gap:11px;width:min(650px,100%);margin:2px auto}.choice{border:2px solid #e8def4;border-radius:19px;background:#fff;padding:15px;min-height:60px;font-size:clamp(19px,4vw,25px);font-weight:900}.choice.good{background:#dcfce7;border-color:#22c55e;color:#166534}.choice.bad{background:#fee2e2;border-color:#ef4444;color:#991b1b}.result{text-align:center}.trophy{font-size:86px}.result h2{font-size:clamp(31px,7vw,48px);margin:5px}.result p{font-size:18px;color:var(--muted)}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}.item{background:#fff;border:2px solid #eee6f5;border-radius:19px;padding:15px}.itemMeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:9px}.item strong{line-height:1.45}.item details{margin-top:10px}.item summary{color:var(--violet);font-weight:850;cursor:pointer}dialog{border:0;border-radius:25px;padding:0;width:min(610px,calc(100% - 22px));box-shadow:0 25px 80px #1d102b55}dialog::backdrop{background:#24183299;backdrop-filter:blur(4px)}.dlg{padding:23px}.dlgHead{display:flex;justify-content:space-between;align-items:center}.dlgHead h2{margin:0}.form{display:grid;gap:10px}.form label{font-size:14px;font-weight:850}.form label span{display:block;margin-bottom:5px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:#29223b;color:#fff;padding:11px 17px;border-radius:99px;font-weight:850;transition:.23s;z-index:30}.toast.show{transform:translate(-50%,0)}.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}.confetti i{position:absolute;top:-25px;font-style:normal;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}footer{text-align:center;color:var(--muted);font-size:13px;padding-top:25px}@media(max-width:650px){.modes{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters .btn{grid-column:1/-1}.questionCard{padding:21px 14px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><span class="logo">❓</span>수수께끼 놀이터</div><div class="icons"><button class="icon" id="listOpen" aria-label="전체 문제">📚</button><button class="icon" id="manageOpen" aria-label="문제 관리">⚙️</button></div></header>
<main>
<section id="home" class="panel hero"><div class="heroEmoji">🧠✨</div><h1>생각이 톡! 웃음이 팡!</h1><p class="lead">초등학교 1학년 눈높이 수수께끼를 부모님이 쉽게 내거나, 아이가 보기 3개 중 정답을 고르며 직접 풀 수 있어요.</p><div class="modes"><button class="mode" data-mode="host"><span>👨‍👩‍👧</span><b>같이 문제 내기</b><small>문제 → 힌트 → 정답 순서로 보여 줘요.</small></button><button class="mode" data-mode="play"><span>🎮</span><b>혼자 도전하기</b><small>10문제를 풀고 별을 모아요. 읽어주기도 돼요.</small></button></div><div class="filters"><select id="cat"><option value="전체">모든 분야</option></select><select id="diff"><option value="전체">모든 난이도</option><option value="1">쉬움</option><option value="2">조금 생각</option></select><button class="btn primary" id="quick">🎲 바로 시작</button></div><p id="dataInfo" class="tiny">문제를 불러오는 중이에요…</p></section>
<section id="game" class="hidden"><div class="top"><button class="btn soft homeBtn">← 처음</button><div class="progressBar"><div id="progress" class="progress"></div></div><div id="stat" class="stat">⭐ 0</div></div><article class="panel questionCard"><span id="pill" class="pill"></span><div id="qEmoji" class="qEmoji">❓</div><div id="question" class="question"></div><div id="hintBox" class="box hint hidden"></div><div id="answerBox" class="box answer hidden"></div><div id="explainBox" class="box explain hidden"></div><div id="choices" class="choices hidden"></div><div id="hostActions" class="actions"><button class="btn yellow" id="speak">🔊 읽어주기</button><button class="btn soft" id="hint">💡 힌트</button><button class="btn primary" id="answer">✨ 정답 보기</button><button class="btn soft hidden" id="next">다음 문제 →</button></div></article></section>
<section id="result" class="panel result hidden"><div class="trophy">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="actions"><button class="btn primary" id="again">한 번 더!</button><button class="btn soft homeBtn">처음으로</button></div></section>
<section id="all" class="panel hidden"><div class="top"><h2 style="margin:0;flex:1">전체 문제 보기</h2><button class="btn soft homeBtn">닫기</button></div><div class="filters"><input id="search" type="search" placeholder="문제나 정답 검색"><select id="listCat"><option value="전체">모든 분야</option></select><button class="btn soft" id="shuffleList">🔀 섞기</button></div><p id="count" class="tiny"></p><div id="list" class="list"></div></section>
</main><footer>아이와 함께 웃고, 틀려도 다시 생각해 보는 놀이터 · <span id="version"></span></footer>
</div>
<dialog id="manage"><div class="dlg"><div class="dlgHead"><h2>⚙️ 문제 관리</h2><button class="icon" id="manageClose">✕</button></div><p class="tiny">기본 문제는 <code>data/riddles.json</code>에서 관리해요. 여기서 추가한 문제는 이 기기에 저장되며 JSON으로 내보낼 수 있어요.</p><form id="form" class="form"><label><span>문제</span><input id="newQ" required maxlength="120"></label><label><span>정답</span><input id="newA" required maxlength="30"></label><label><span>힌트</span><input id="newH" maxlength="80"></label><label><span>설명</span><input id="newE" maxlength="120"></label><label><span>분야</span><select id="newC"></select></label><button class="btn primary">➕ 이 기기에 추가</button></form><div class="actions"><button class="btn soft" id="export">⬇️ JSON 내보내기</button><label class="btn soft" style="display:inline-flex;align-items:center">⬆️ JSON 불러오기<input id="import" type="file" accept="application/json" hidden></label><button class="btn danger" id="clear">추가 문제 지우기</button></div><p id="customInfo" class="tiny"></p></div></dialog>
<div id="toast" class="toast"></div><div id="confetti" class="confetti"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const CATS=["동물","음식","학교","생활","자연","말놀이","생각"],CE={동물:"🐾",음식:"🍓",학교:"✏️",생활:"🏠",자연:"🌈",말놀이:"😄",생각:"🧠"};
const S={base:[],custom:[],seq:[],i:0,score:0,mode:"host",locked:false};
const all=()=>[...S.base,...S.custom],mix=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},pick=a=>a[Math.floor(Math.random()*a.length)],dname=n=>+n===1?"쉬움":"조금 생각";
function msg(t){let e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove("show"),1700)}
function party(){let b=$("#confetti"),x=["⭐","🎉","✨","💜","🌟"];b.innerHTML="";for(let i=0;i<24;i++){let e=document.createElement("i");e.textContent=pick(x);e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*.4+"s";e.style.fontSize=14+Math.random()*20+"px";b.append(e)}setTimeout(()=>b.innerHTML="",1900)}
async function decode(w){if(w.encoding!=="gzip-base64")return w;if(!window.DecompressionStream)throw Error("압축 문제 파일을 지원하지 않는 브라우저예요.");let u=Uint8Array.from(atob(w.payload),c=>c.charCodeAt(0)),st=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(st).text())}
async function load(){try{let r=await fetch("data/riddles.json",{cache:"no-cache"});if(!r.ok)throw Error();let data=await decode(await r.json());S.base=data.riddles||[];S.custom=JSON.parse(localStorage.getItem("susu-custom")||"[]");CATS.forEach(c=>{["cat","listCat","newC"].forEach(id=>{let o=document.createElement("option");o.value=c;o.textContent=`${CE[c]} ${c}`;$("#"+id).append(o)})});$("#dataInfo").textContent=`기본 ${S.base.length}문제${S.custom.length?` + 내 문제 ${S.custom.length}개`:""} · ${data.meta?.target||"초등 저학년"}`;$("#version").textContent=data.meta?.dataVersion||"1";customInfo()}catch(e){console.error(e);$("#dataInfo").textContent="문제를 불러오지 못했어요. 새로고침해 주세요."}}
function view(id){["home","game","result","all"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==id));scrollTo({top:0,behavior:"smooth"})}
function pool(){let c=$("#cat").value,d=$("#diff").value;return all().filter(r=>(c==="전체"||r.category===c)&&(d==="전체"||String(r.difficulty)===d))}
function start(mode){let p=pool();if(!p.length)return msg("조건에 맞는 문제가 없어요.");S.mode=mode;S.i=0;S.score=0;S.seq=mix(p).slice(0,mode==="play"?Math.min(10,p.length):p.length);view("game");render()}
function render(){let r=S.seq[S.i];S.locked=false;$("#pill").textContent=`${CE[r.category]||"❓"} ${r.category} · ${dname(r.difficulty)}`;$("#qEmoji").textContent=r.emoji||"❓";$("#question").textContent=r.question;$("#hintBox").textContent="💡 "+(r.hint||"정답의 모습을 떠올려 보세요.");$("#answerBox").textContent="정답: "+r.answer;$("#explainBox").textContent="알쏭달쏭 풀이: "+(r.explanation||r.answer);["hintBox","answerBox","explainBox"].forEach(x=>$("#"+x).classList.add("hidden"));$("#next").classList.add("hidden");$("#answer").classList.remove("hidden");let play=S.mode==="play";$("#hostActions").classList.toggle("hidden",play);$("#choices").classList.toggle("hidden",!play);$("#stat").textContent=play?`⭐ ${S.score}`:`${S.i+1} / ${S.seq.length}`;$("#progress").style.width=(play?S.i/S.seq.length:(S.i+1)/S.seq.length)*100+"%";if(play)choices(r)}
function choices(r){let same=all().filter(x=>x.id!==r.id&&x.answer!==r.answer&&x.category===r.category),other=all().filter(x=>x.id!==r.id&&x.answer!==r.answer),wrong=mix(same.length>1?same:other).slice(0,2).map(x=>x.answer),box=$("#choices");box.innerHTML="";mix([r.answer,...wrong]).forEach(a=>{let b=document.createElement("button");b.className="choice";b.textContent=a;b.onclick=()=>choose(b,a,r);box.append(b)})}
function choose(b,a,r){if(S.locked)return;S.locked=true;let ok=a===r.answer;$$('.choice').forEach(x=>{x.disabled=true;if(x.textContent===r.answer)x.classList.add("good")});if(ok){S.score++;b.classList.add("good");party();speak("정답이에요! "+r.answer)}else{b.classList.add("bad");speak("아쉬워요. 정답은 "+r.answer+"예요.")}$("#explainBox").classList.remove("hidden");$("#stat").textContent=`⭐ ${S.score}`;setTimeout(next,ok?1400:2100)}
function next(){if(++S.i>=S.seq.length)return finish();render()}
function finish(){let n=S.seq.length,q=S.score/n;$("#resultTitle").textContent=q===1?"수수께끼 왕 탄생!":q>=.7?"정말 멋진 도전!":"생각 근육이 쑥쑥!";$("#resultText").textContent=`${n}문제 중 ${S.score}문제를 맞혔어요. 틀려도 다시 생각하면 더 똑똑해져요!`;if(q>=.7)party();view("result")}
function speak(t){if(!speechSynthesis)return msg("읽어주기를 지원하지 않아요.");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.92;speechSynthesis.speak(u)}
function showAnswer(){$("#answerBox").classList.remove("hidden");$("#explainBox").classList.remove("hidden");$("#answer").classList.add("hidden");$("#next").classList.remove("hidden");party()}
function list(){let q=$("#search").value.trim().toLowerCase(),c=$("#listCat").value,rows=all().filter(r=>(c==="전체"||r.category===c)&&(!q||[r.question,r.answer,r.hint].join(" ").toLowerCase().includes(q))),box=$("#list");$("#count").textContent=`${rows.length}개의 문제`;box.innerHTML="";rows.forEach(r=>{let e=document.createElement("article");e.className="item";let m=document.createElement("div");m.className="itemMeta";m.innerHTML=`<span>${CE[r.category]} ${r.category}</span><span>${dname(r.difficulty)}</span>`;let s=document.createElement("strong");s.textContent=`${r.emoji||"❓"} ${r.question}`;let d=document.createElement("details"),sm=document.createElement("summary"),p=document.createElement("p");sm.textContent="정답과 풀이 보기";p.textContent=`정답: ${r.answer} · ${r.explanation||""}`;d.append(sm,p);e.append(m,s,d);box.append(e)})}
function save(){localStorage.setItem("susu-custom",JSON.stringify(S.custom));customInfo()}function customInfo(){$("#customInfo").textContent=`이 기기에 저장된 내 문제: ${S.custom.length}개`}
$$('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));$("#quick").onclick=()=>start(Math.random()<.5?"host":"play");$$('.homeBtn').forEach(b=>b.onclick=()=>view("home"));$("#hint").onclick=()=>$("#hintBox").classList.remove("hidden");$("#answer").onclick=showAnswer;$("#next").onclick=next;$("#speak").onclick=()=>speak(S.seq[S.i]?.question||"");$("#again").onclick=()=>start("play");$("#listOpen").onclick=()=>{view("all");list()};$("#search").oninput=list;$("#listCat").onchange=list;$("#shuffleList").onclick=()=>{S.base=mix(S.base);list()};$("#manageOpen").onclick=()=>$("#manage").showModal();$("#manageClose").onclick=()=>$("#manage").close();
$("#form").onsubmit=e=>{e.preventDefault();S.custom.push({id:`custom-${Date.now()}`,category:$("#newC").value,difficulty:1,emoji:"⭐",question:$("#newQ").value.trim(),answer:$("#newA").value.trim(),hint:$("#newH").value.trim(),explanation:$("#newE").value.trim()});save();e.target.reset();msg("새 문제를 추가했어요!")};
$("#export").onclick=()=>{let b=new Blob([JSON.stringify({meta:{schemaVersion:1,exportedAt:new Date().toISOString()},riddles:S.custom},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="susu-my-riddles.json";a.click();URL.revokeObjectURL(a.href)};
$("#import").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text()),a=Array.isArray(d)?d:d.riddles;if(!Array.isArray(a))throw Error();let clean=a.filter(x=>x.question&&x.answer).map((x,i)=>({id:x.id||`import-${Date.now()}-${i}`,category:CATS.includes(x.category)?x.category:"생각",difficulty:+x.difficulty===2?2:1,emoji:x.emoji||"⭐",question:String(x.question),answer:String(x.answer),hint:String(x.hint||""),explanation:String(x.explanation||"")}));S.custom.push(...clean);save();msg(`${clean.length}개 문제를 불러왔어요.`)}catch{msg("올바른 문제 JSON이 아니에요.")}};
$("#clear").onclick=()=>{if(confirm("이 기기에 추가한 문제를 모두 지울까요?")){S.custom=[];save();msg("추가 문제를 지웠어요.")}};document.onkeydown=e=>{if($("#game").classList.contains("hidden")||S.mode!=="host")return;if(e.key==="h")$("#hint").click();if(e.key===" "||e.key==="Enter"){e.preventDefault();$("#next").classList.contains("hidden")?showAnswer():next()}};load();
</script>
</body></html>
